<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adhérents | Dioulacolon</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
            color: #222;
        }

        h1 {
            text-align: center;
            color: #1b5e20;
        }

        /* =========================
           CONNEXION
        ========================= */

        #connexion {
            max-width: 420px;
            margin: 70px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
            text-align: center;
        }

        #connexion h2 {
            color: #1b7f3a;
        }

        #connexion input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        #boutonConnexion {
            width: 100%;
            padding: 14px;
            background: #1b7f3a;
        }

        #erreur {
            color: #c62828;
            font-weight: bold;
        }

        /* =========================
           PAGE ADHERENTS
        ========================= */

        #pageAdherents {
            display: none;
        }

        .barre {
            max-width: 900px;
            margin: 20px auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .recherche {
            flex: 1;
            min-width: 250px;
        }

        .recherche input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .deconnexion {
            background: #c62828;
        }

        .resultats {
            max-width: 900px;
            margin: auto;
        }

        .carte {
            background: white;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .numero {
            font-weight: bold;
            font-size: 20px;
            color: #1b7f3a;
            margin-bottom: 15px;
        }

        .carte p {
            margin: 8px 0;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .modifier {
            background: #1565c0;
        }

        .supprimer {
            background: #c62828;
        }

        .message {
            text-align: center;
            margin: 20px;
            font-weight: bold;
        }

        #statut {
            max-width: 900px;
            margin: 10px auto;
            text-align: center;
            font-weight: bold;
        }

        /* =========================
           FENETRE MODIFICATION
        ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.55);
            padding: 15px;
            overflow: auto;
        }

        .modal-contenu {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 22px;
            border-radius: 12px;
        }

        .modal-contenu h2 {
            color: #1b5e20;
        }

        .modal-contenu input,
        .modal-contenu textarea {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .modal-contenu textarea {
            min-height: 90px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .enregistrer {
            background: #1b7f3a;
            flex: 1;
        }

        .annuler {
            background: #777;
            flex: 1;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .actions button {
                flex: 1;
            }

        }

    </style>

</head>

<body>


<!-- =========================
     CONNEXION
========================= -->

<div id="connexion">

    <h2>🔐 Accès aux adhérents</h2>

    <p>
        Cette page est réservée à l'administration.
    </p>

    <input
        type="password"
        id="motDePasse"
        placeholder="Entrez le mot de passe"
    >

    <button id="boutonConnexion">
        🔓 Se connecter
    </button>

    <p id="erreur"></p>

</div>


<!-- =========================
     PAGE ADHERENTS
========================= -->

<div id="pageAdherents">

    <h1>👥 Adhérents - Dioulacolon</h1>


    <div class="barre">

        <div class="recherche">

            <input
                type="text"
                id="recherche"
                placeholder="🔎 Nom, téléphone, village ou N° adhérent..."
            >

        </div>


        <button
            class="deconnexion"
            id="boutonDeconnexion">

            🔒 Déconnexion

        </button>

    </div>


    <div id="statut"></div>


    <div id="resultats" class="resultats">

        <p class="message">
            ⏳ Chargement des adhérents...
        </p>

    </div>

</div>


<!-- =========================
     MODIFICATION
========================= -->

<div id="modal" class="modal">

    <div class="modal-contenu">

        <h2>✏️ Modifier l'adhérent</h2>


        <input id="f0" placeholder="N° adhérent">

        <input id="f1" placeholder="Date">

        <input id="f2" placeholder="Nom">

        <input id="f3" placeholder="Téléphone">

        <input id="f4" placeholder="Village">

        <input id="f5" placeholder="Profession">

        <input id="f6" placeholder="Sexe">

        <input id="f7" placeholder="Âge">

        <input id="f8" placeholder="Domaine">

        <input id="f9" placeholder="Terrain">

        <input id="f10" placeholder="Bénévole">

        <textarea
            id="f11"
            placeholder="Message">
        </textarea>


        <div class="modal-actions">

            <button
                class="annuler"
                id="annuler">

                Annuler

            </button>


            <button
                class="enregistrer"
                id="enregistrer">

                💾 Enregistrer

            </button>

        </div>

    </div>

</div>


<script>


/* =========================
   MOT DE PASSE
========================= */

const MOT_DE_PASSE = "Ramousse89";


/* =========================
   GOOGLE APPS SCRIPT
========================= */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzHLMGbin51gYuBhYG72K14rmA1GGsJOnMpTrKiqroaRzs80cr5qglbb3In-0lwtecPdw/exec";


let adherents = [];

let ligneModification = null;


/* =========================
   CONNEXION
========================= */

function connexion() {

    const mot =
        document.getElementById("motDePasse").value.trim();


    if (mot === MOT_DE_PASSE) {

        document.getElementById("connexion")
            .style.display = "none";

        document.getElementById("pageAdherents")
            .style.display = "block";

        chargerAdherents();

    } else {

        document.getElementById("erreur")
            .textContent =
            "❌ Mot de passe incorrect.";

        document.getElementById("motDePasse")
            .value = "";

    }

}


/* =========================
   DECONNEXION
========================= */

function deconnexion() {

    document.getElementById("pageAdherents")
        .style.display = "none";

    document.getElementById("connexion")
        .style.display = "block";

    document.getElementById("motDePasse")
        .value = "";

}


/* =========================
   CHARGER GOOGLE SHEETS
========================= */

async function chargerAdherents() {

    const zone =
        document.getElementById("resultats");


    zone.innerHTML =
        '<p class="message">⏳ Chargement...</p>';


    try {

        const response =
            await fetch(GOOGLE_SCRIPT_URL);


        if (!response.ok) {

            throw new Error(
                "Erreur HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (!Array.isArray(data)) {

            throw new Error(
                "Les données reçues sont invalides."
            );

        }


        adherents = data;

        afficher(adherents);


    } catch (erreur) {

        console.error(erreur);


        zone.innerHTML =
            '<p class="message">' +
            '❌ Impossible de charger les adhérents.' +
            '</p>';

    }

}


/* =========================
   RECHERCHE
========================= */

function rechercher() {

    const texte =
        document.getElementById("recherche")
        .value
        .toLowerCase()
        .trim();


    if (texte === "") {

        afficher(adherents);

        return;

    }


    const resultats =
        adherents.filter(function(ligne, index) {

            if (
                index === 0 ||
                !Array.isArray(ligne)
            ) {

                return false;

            }


            return ligne.some(function(cellule) {

                return String(cellule || "")
                    .toLowerCase()
                    .includes(texte);

            });

        });


    afficher(resultats);

}


/* =========================
   AFFICHER
========================= */

function afficher(liste) {

    const zone =
        document.getElementById("resultats");


    zone.innerHTML = "";


    if (
        !Array.isArray(liste) ||
        liste.length <= 1
    ) {

        zone.innerHTML =
            '<p class="message">' +
            '❌ Aucun adhérent trouvé.' +
            '</p>';

        return;

    }


    liste.forEach(function(ligne, index) {


        if (
            index === 0 ||
            !Array.isArray(ligne)
        ) {

            return;

        }


        /*
          Le tableau commence à la ligne 2
          dans Google Sheets.
        */

        const ligneSheet =
            adherents.indexOf(ligne) + 1;


        const carte =
            document.createElement("div");


        carte.className = "carte";


        carte.innerHTML = `

            <div class="numero">

                🔢 ${echapper(ligne[0])}

            </div>


            <p>
                📅 <strong>Date :</strong>
                ${echapper(ligne[1])}
            </p>


            <p>
                👤 <strong>Nom :</strong>
                ${echapper(ligne[2])}
            </p>


            <p>
                📞 <strong>Téléphone :</strong>
                ${echapper(ligne[3])}
            </p>


            <p>
                📍 <strong>Village :</strong>
                ${echapper(ligne[4])}
            </p>


            <p>
                💼 <strong>Profession :</strong>
                ${echapper(ligne[5])}
            </p>


            <p>
                ⚧ <strong>Sexe :</strong>
                ${echapper(ligne[6])}
            </p>


            <p>
                🎂 <strong>Âge :</strong>
                ${echapper(ligne[7])}
            </p>


            <p>
                🤝 <strong>Domaine :</strong>
                ${echapper(ligne[8])}
            </p>


            <p>
                🚶 <strong>Terrain :</strong>
                ${echapper(ligne[9])}
            </p>


            <p>
                🙋 <strong>Bénévole :</strong>
                ${echapper(ligne[10])}
            </p>


            <p>
                💬 <strong>Message :</strong>
                ${echapper(ligne[11])}
            </p>


            <div class="actions">

                <button
                    class="modifier"
                    onclick="ouvrirModification(${ligneSheet})">

                    ✏️ Modifier

                </button>


                <button
                    class="supprimer"
                    onclick="supprimerAdherent(${ligneSheet})">

                    🗑️ Supprimer

                </button>

            </div>

        `;


        zone.appendChild(carte);

    });

}


/* =========================
   OUVRIR MODIFICATION
========================= */

function ouvrirModification(ligneSheet) {

    ligneModification =
        ligneSheet;


    const ligne =
        adherents[ligneSheet - 1];


    if (!ligne) {

        alert(
            "❌ Adhérent introuvable."
        );

        return;

    }


    for (
        let i = 0;
        i < 12;
        i++
    ) {

        document.getElementById(
            "f" + i
        ).value =
            ligne[i] || "";

    }


    document.getElementById("modal")
        .style.display = "block";

}


/* =========================
   FERMER MODIFICATION
========================= */

function fermerModal() {

    document.getElementById("modal")
        .style.display = "none";

    ligneModification = null;

}


/* =========================
   ENREGISTRER MODIFICATION
========================= */

async function enregistrerModification() {

    if (!ligneModification) {
        return;
    }


    const valeurs = [];


    for (
        let i = 0;
        i < 12;
        i++
    ) {

        valeurs.push(
            document.getElementById(
                "f" + i
            ).value.trim()
        );

    }


    const bouton =
        document.getElementById(
            "enregistrer"
        );


    bouton.disabled = true;

    bouton.textContent =
        "⏳ Enregistrement...";


    try {

        const resultat =
            await envoyer({

                action: "modifier",

                ligne: ligneModification,

                valeurs: valeurs

            });


        if (!resultat.success) {

            throw new Error(
                resultat.erreur ||
                "Modification refusée."
            );

        }


        alert(
            "✅ Adhérent modifié dans Google Sheets."
        );


        fermerModal();


        await chargerAdherents();


    } catch (erreur) {

        console.error(erreur);


        alert(
            "❌ La modification n'a pas été enregistrée.\n\n" +
            erreur.message
        );


    } finally {

        bouton.disabled = false;

        bouton.textContent =
            "💾 Enregistrer";

    }

}


/* =========================
   SUPPRIMER
========================= */

async function supprimerAdherent(ligneSheet) {

    const ligne =
        adherents[ligneSheet - 1];


    if (!ligne) {

        alert(
            "❌ Adhérent introuvable."
        );

        return;

    }


    const nom =
        ligne[2] ||
        ligne[0] ||
        "cet adhérent";


    const confirmation =
        confirm(
            "Voulez-vous vraiment supprimer " +
            nom +
            " ?"
        );


    if (!confirmation) {
        return;
    }


    try {

        document.getElementById(
            "statut"
        ).textContent =
            "⏳ Suppression...";


        const resultat =
            await envoyer({

                action: "supprimer",

                ligne: ligneSheet

            });


        if (!resultat.success) {

            throw new Error(
                resultat.erreur ||
                "Suppression refusée."
            );

        }


        alert(
            "🗑️ Adhérent supprimé de Google Sheets."
        );


        await chargerAdherents();


    } catch (erreur) {

        console.error(erreur);


        alert(
            "❌ La suppression n'a pas été effectuée.\n\n" +
            erreur.message
        );

    }

}


/* =========================
   ENVOYER AU SCRIPT
========================= */

async function envoyer(donnees) {

    const response =
        await fetch(
            GOOGLE_SCRIPT_URL,
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(donnees)

            }
        );


    if (!response.ok) {

        throw new Error(
            "Erreur HTTP " +
            response.status
        );

    }


    return await response.json();

}


/* =========================
   SECURITE AFFICHAGE
========================= */

function echapper(valeur) {

    if (
        valeur === null ||
        valeur === undefined
    ) {

        return "";

    }


    return String(valeur)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================
   EVENEMENTS
========================= */

document
    .getElementById("boutonConnexion")
    .addEventListener(
        "click",
        connexion
    );


document
    .getElementById("boutonDeconnexion")
    .addEventListener(
        "click",
        deconnexion
    );


document
    .getElementById("recherche")
    .addEventListener(
        "input",
        rechercher
    );


document
    .getElementById("motDePasse")
    .addEventListener(
        "keydown",
        function(e) {

            if (e.key === "Enter") {

                connexion();

            }

        }
    );


document
    .getElementById("annuler")
    .addEventListener(
        "click",
        fermerModal
    );


document
    .getElementById("enregistrer")
    .addEventListener(
        "click",
        enregistrerModification
    );


window.addEventListener(
    "click",
    function(e) {

        if (
            e.target ===
            document.getElementById("modal")
        ) {

            fermerModal();

        }

    }
);

</script>

</body>
</html>
