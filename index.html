<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adhérents | Dioulacolon</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f4f6f8}
h1{text-align:center;color:#1b5e20}
#connexion{max-width:400px;margin:80px auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.15);text-align:center}
#connexion h2{color:#1b7f3a}
input{width:100%;padding:14px;margin:10px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:8px;background:#1b7f3a;color:#fff;font-size:16px;cursor:pointer}
button:hover{background:#145c2a}
#erreur{color:#c62828;font-weight:bold}
#pageAdherents{display:none}
.recherche{max-width:600px;margin:20px auto}
.resultats{max-width:900px;margin:auto}
.carte{background:#fff;padding:18px;margin-bottom:15px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.numero{font-weight:bold;font-size:20px;margin-bottom:15px;color:#1b7f3a}
.carte p{margin:8px 0}
.message{text-align:center;margin:20px;font-weight:bold}
.deconnexion{display:block;width:auto;margin:20px auto;padding:10px 20px;background:#c62828}
.deconnexion:hover{background:#a51f1f}
</style>
</head>
<body>

<div id="connexion">
<h2>🔐 Accès aux adhérents</h2>
<p>Cette page est réservée à l'administration.</p>
<input type="password" id="motDePasse" placeholder="Entrez le mot de passe">
<button id="boutonConnexion">🔓 Se connecter</button>
<p id="erreur"></p>
</div>

<div id="pageAdherents">
<h1>👥 Adhérents - Dioulacolon</h1>
<button class="deconnexion" id="boutonDeconnexion">🔒 Se déconnecter</button>

<div class="recherche">
<input type="text" id="recherche" placeholder="🔎 Rechercher par nom, téléphone, village ou N° adhérent...">
</div>

<div id="resultats" class="resultats">
<p class="message">⏳ Chargement des adhérents...</p>
</div>
</div>

<script>
const MOT_DE_PASSE = "Ramousse89";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzK8xG6FG8oAtLQkXvEezssHxsUIe8aly6CFH_OeY30h8iifdkVsuia8KGh2D5YYn5VWg/exec";

let adherents = [];

const connexionDiv=document.getElementById("connexion");
const pageAdherents=document.getElementById("pageAdherents");
const motDePasse=document.getElementById("motDePasse");
const boutonConnexion=document.getElementById("boutonConnexion");
const boutonDeconnexion=document.getElementById("boutonDeconnexion");
const erreur=document.getElementById("erreur");
const recherche=document.getElementById("recherche");
const resultats=document.getElementById("resultats");

function connexion(){
    erreur.textContent="";
    if(motDePasse.value.trim()===MOT_DE_PASSE){
        connexionDiv.style.display="none";
        pageAdherents.style.display="block";
        chargerAdherents();
    }else{
        erreur.textContent="❌ Mot de passe incorrect.";
        motDePasse.value="";
        motDePasse.focus();
    }
}

function deconnexion(){
    pageAdherents.style.display="none";
    connexionDiv.style.display="block";
    motDePasse.value="";
    recherche.value="";
    erreur.textContent="";
}

async function chargerAdherents(){
    resultats.innerHTML='<p class="message">⏳ Chargement des adhérents...</p>';
    try{
        const response=await fetch(GOOGLE_SCRIPT_URL);
        if(!response.ok) throw new Error("Erreur HTTP : "+response.status);
        const data=await response.json();
        if(!Array.isArray(data)) throw new Error("Les données reçues ne sont pas un tableau.");
        adherents=data;
        afficher(adherents);
    }catch(error){
        console.error(error);
        resultats.innerHTML='<div class="carte"><p class="message">❌ Impossible de charger les adhérents.</p><p>Vérifie que ton Google Apps Script est bien déployé comme application Web.</p><p>Détail : '+echapper(error.message)+'</p></div>';
    }
}

function rechercher(){
    const texte=recherche.value.toLowerCase().trim();
    if(!texte){afficher(adherents);return;}
    const filtres=adherents.filter((ligne,index)=>{
        if(index===0 || !Array.isArray(ligne)) return false;
        return ligne.some(cellule=>String(cellule??"").toLowerCase().includes(texte));
    });
    afficher(filtres);
}

function afficher(liste){
    resultats.innerHTML="";
    if(!Array.isArray(liste) || liste.length<=1){
        resultats.innerHTML='<p class="message">❌ Aucun adhérent trouvé.</p>';
        return;
    }
    for(let index=1;index<liste.length;index++){
        const ligne=liste[index];
        if(!Array.isArray(ligne)) continue;
        const carte=document.createElement("div");
        carte.className="carte";
        carte.innerHTML=`
        <div class="numero">🔢 ${echapper(ligne[0])}</div>
        <p>📅 <strong>Date :</strong> ${echapper(ligne[1])}</p>
        <p>👤 <strong>Nom :</strong> ${echapper(ligne[2])}</p>
        <p>📞 <strong>Téléphone :</strong> ${echapper(ligne[3])}</p>
        <p>📍 <strong>Village :</strong> ${echapper(ligne[4])}</p>
        <p>💼 <strong>Profession :</strong> ${echapper(ligne[5])}</p>
        <p>⚧ <strong>Sexe :</strong> ${echapper(ligne[6])}</p>
        <p>🎂 <strong>Âge :</strong> ${echapper(ligne[7])}</p>
        <p>🤝 <strong>Domaine :</strong> ${echapper(ligne[8])}</p>
        <p>🚶 <strong>Terrain :</strong> ${echapper(ligne[9])}</p>
        <p>🙋 <strong>Bénévole :</strong> ${echapper(ligne[10])}</p>
        <p>💬 <strong>Message :</strong> ${echapper(ligne[11])}</p>`;
        resultats.appendChild(carte);
    }
}

function echapper(v){
    if(v===null||v===undefined)return "";
    return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

boutonConnexion.addEventListener("click",connexion);
boutonDeconnexion.addEventListener("click",deconnexion);
recherche.addEventListener("input",rechercher);
motDePasse.addEventListener("keydown",e=>{if(e.key==="Enter")connexion();});
</script>
</body>
</html>
